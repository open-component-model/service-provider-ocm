name: Versioned Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release_tag:
    name: Release version
    runs-on: ubuntu-26.04
    permissions:
      contents: write # create the GitHub release; the release bot token creates the tags
    environment:
      name: release-automation
      deployment: false
    outputs:
      version: ${{ env.version }}
      skip: ${{ env.SKIP }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-tags: true
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read and validate VERSION
        id: version
        run: |
          VERSION=$(task version)
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-dev(-[0-9a-f]*)?)?$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi
          echo "New version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: Skip release if version is a dev version
        if: contains(env.version, '-dev')
        run: |
          echo "Skipping development version release: ${version}"
          echo "SKIP=true" >> $GITHUB_ENV
          exit 0

      - name: Check if VERSION is already tagged
        id: check_tag
        run: |
          if git rev-parse "refs/tags/${version}" >/dev/null 2>&1; then
            echo "Tag ${version} already exists. Skipping release."
            echo "SKIP=true" >> $GITHUB_ENV
            exit 0
          fi
          echo "Tag ${version} doesn't exists. Proceeding with release."

      # Only ocm-bot-release may create tags (org ruleset "Tag Creation"). Its token is
      # created only when a release is due, and only for creating the tags.
      - name: Get release bot token
        if: ${{ env.SKIP != 'true' }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # create the release tags

      # The tags are created through the REST API (annotated tag object, then the
      # refs/tags/<tag> reference). gh reads the token from GH_TOKEN; git never gets it.
      - name: Create Git tags
        if: ${{ env.SKIP != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          SHA="$(git rev-parse HEAD)"
          TAGGER_NAME="$(git log -1 --pretty=format:'%an')"
          TAGGER_EMAIL="$(git log -1 --pretty=format:'%ae')"
          echo "Tagging ${SHA} as ${TAGGER_NAME} <${TAGGER_EMAIL}>"

          create_tag() {
            local tag_object
            tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" \
              -f tag="$1" \
              -f message="Release ${version}" \
              -f object="${SHA}" \
              -f type=commit \
              -f "tagger[name]=${TAGGER_NAME}" \
              -f "tagger[email]=${TAGGER_EMAIL}" \
              --jq .sha)"
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/$1" \
              -f sha="${tag_object}" \
              --silent
          }

          create_tag "${version}"

          NESTED_GO_MODULES="$(task release:list-nested-modules)"

          for MODULE in $NESTED_GO_MODULES; do
            create_tag "${MODULE}/${version}"
          done

      - name: Create GitHub release
        if: ${{ env.SKIP != 'true' }}
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ env.version }}
          name: Release ${{ env.version }}
          generate_release_notes: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dev_version_pr:
    name: Dev version PR
    needs: release_tag
    if: ${{ needs.release_tag.outputs.skip != 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-dev-version-pr.yaml
    # The called job reads these from its "pull-requests" environment, but the caller still has
    # to pass them. Passing them by name instead of `secrets: inherit` hands over only these two.
    secrets:
      PR_BOT_CLIENT_ID: ${{ secrets.PR_BOT_CLIENT_ID }}
      PR_BOT_PRIVATE_KEY: ${{ secrets.PR_BOT_PRIVATE_KEY }}
    with:
      version: ${{ needs.release_tag.outputs.version }}
