name: Dev Version PR

on:
  # Both triggers check out the commit to bump: the release commit when called from release.yaml
  # (a called workflow shares the caller's github context), the selected branch when run by hand.
  # The version to bump is read from its VERSION file.
  workflow_call:
    secrets:
      PR_BOT_CLIENT_ID:
        required: true
      PR_BOT_PRIVATE_KEY:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-version-pr
  cancel-in-progress: false

jobs:
  create-dev-pr:
    name: Pull Request
    runs-on: ubuntu-26.04
    permissions:
      contents: read # the bot token pushes and opens the pull request
    environment:
      name: pull-requests
      deployment: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Change to dev VERSION
        run: |
          VERSION="$(task version)"
          VERSION="${VERSION%%-dev*}-dev"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev$ ]]; then
            echo "Refusing to run: computed version '$VERSION' is not a valid -dev version"
            exit 1
          fi
          task release:set-version --verbose -- "$VERSION"

      # Only ocm-bot-pull-request may write automation/** branches (org ruleset "Automation
      # Branches"). create-pull-request authenticates with this token itself.
      - name: Get pull request bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # push automation/dev-version
          permission-pull-requests: write # open the pull request

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          title: "chore(release): change to dev version"
          commit-message: "chore(release): change to dev version"
          branch: "automation/dev-version"
          delete-branch: true
          sign-commits: true
          add-paths: |
            VERSION
          body: |
            **What this PR does / why we need it**:

            Update service provider OCM Version to "-dev" again.

            **Release note**:
            ```other operator
            NONE
            ```
