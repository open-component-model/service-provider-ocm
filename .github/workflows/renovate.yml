name: Renovate
on:
  schedule:
    - cron: '0 3 * * 0'  # Sundays at 03:00 UTC
  workflow_dispatch:
    inputs:
      ignore_schedule:
        description: 'Run now, ignoring the Sunday schedule defined in renovate.json5'
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: read

env:
  RENOVATE_CONFIG_FILE: .github/renovate.json5

jobs:
  renovate:
    runs-on: ubuntu-latest
    environment:
      name: automation
      deployment: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            ${{ env.RENOVATE_CONFIG_FILE }}
          persist-credentials: false

      # Only ocm-bot-renovate (and ocm-bot-deps) may write renovate/** branches (org ruleset
      # "Renovate Branches").
      - if: ${{ github.event_name != 'pull_request' && github.repository_owner == 'open-component-model' }}
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: read # read CI check runs for the branch status (automerge)
          permission-contents: write # push renovate/** branches
          permission-issues: write # maintain the dependency dashboard issue
          permission-pull-requests: write # open and update dependency update PRs
          permission-statuses: write # post commit statuses on Renovate PRs
          permission-workflows: write # bump action pins in .github/workflows/*
          permission-vulnerability-alerts: read # read Dependabot alerts for vulnerabilityAlerts

      - name: Ensure Dry-Run on Pull Requests
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "RENOVATE_DRY_RUN=extract" >> $GITHUB_ENV
      - name: Override Renovate schedule (manual run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ignore_schedule == true }}
        run: echo 'RENOVATE_FORCE={"schedule":null}' >> $GITHUB_ENV

      - name: Run Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          token: ${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_USERNAME: 'ocm-bot-renovate[bot]'
          RENOVATE_PLATFORM: 'github'
          RENOVATE_PLATFORM_COMMIT: 'true'
          RENOVATE_REPOSITORIES: '${{ github.repository }}'
